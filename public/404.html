<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0b0e" />
    <title>Not Found | The Infinite Buddha</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Served by Vercel for any unknown path, so links and assets use absolute paths. -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #0a0b0e;
        color: #f3f4f6;
        font-family: Inter, sans-serif;
        text-align: center;
      }
      main { max-width: 28rem; }
      img { width: 72px; height: 72px; opacity: 0.85; }
      h1 {
        margin: 24px 0 8px;
        font-family: Cinzel, serif;
        font-weight: 400;
        font-size: 1.5rem;
        letter-spacing: 0.05em;
      }
      .eyebrow {
        margin: 0;
        color: #d4af37;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      p.body { color: #d1d5db; font-weight: 300; line-height: 1.6; font-size: 0.9rem; }
      a.home {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 20px;
        border: 1px solid rgba(212, 175, 55, 0.4);
        border-radius: 8px;
        background: rgba(212, 175, 55, 0.1);
        color: #d4af37;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        transition: background 0.2s;
      }
      a.home:hover, a.home:focus-visible { background: rgba(212, 175, 55, 0.2); }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <p class="eyebrow">404 · Not Found</p>
      <h1>This Buddha has drifted away</h1>
      <p class="body">
        The page you were looking for isn't here. Perhaps it was never generated,
        or the link was mistyped. A new Buddha arrives every day.
      </p>
      <a class="home" href="/">Return to the Sanctuary</a>
    </main>
  </body>
</html>
