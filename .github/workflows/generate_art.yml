name: Generate Infinite Buddha Art

on:
  schedule:
    - cron: "17 8 * * *" # every day at 8:17 UTC (1:17 AM Pacific in summer)
  workflow_dispatch: # lets you run it manually from the Actions tab
permissions:
  contents: write

# Never run two generations at the same time (e.g. manual + scheduled).
concurrency:
  group: generate-art
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate new art piece
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_buddha.py

      - name: Commit and push new art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/output public/data/manifest.json
          if git diff --staged --quiet; then
            echo "No new art to commit."
            exit 0
          fi
          git commit -m "feat: auto-generate new Buddha piece"
          git pull --rebase origin main
          git push origin HEAD:main
